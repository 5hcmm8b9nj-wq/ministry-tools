const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=[
 {k:'kiky',n:'Pastor Kiky Ocansey',s:'L137 Deliverance Ministry',i:'Tools made for Pastor Kiky Ocansey and L137 Deliverance Ministry International, with her prophetic directions listed first.'},
 {k:'prince',n:'Prophet Prince Amo David',s:'Dominion Hour',i:'Tools made for Prophet Prince Amo David and Dominion Hour Ministries International.'},
 {k:'joint',n:'Joint Ministry',s:'L137 × Dominion Hour',i:'Tools made for both ministries together, such as shared websites, the 21-day fast, intercessor training and outreach plans.'},
 {k:'all',n:'All Ministry Tools',s:'L137 + Dominion Hour',i:'Every L137 and Dominion Hour tool in one list.'}];

const NOTE={'Prophetic Directions':'Prophetic directions and prophetic actions given in the ministry, kept with the ministry material.'};
let cur='kiky';const $=s=>document.querySelector(s);
const mname=k=>(M.find(m=>m.k===k)||{}).n;

function list(){const q=$('#q').value.trim().toLowerCase();const s=$('#sort').value;
 const r=TOOLS.filter(t=>(cur==='all'||t.m===cur)&&(!q||(t.title+' '+t.sub+' '+mname(t.m)).toLowerCase().includes(q)));
 r.sort(s==='az'?(a,b)=>a.title.localeCompare(b.title):s==='old'?(a,b)=>a.date.localeCompare(b.date):(a,b)=>b.date.localeCompare(a.date));return r}
function card(t){const d=new Date(t.date+'T12:00');return `<article class="card"><a class="t" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>
<div class="meta">${cur==='all'?`<span class="tag">${esc(mname(t.m))}</span>`:''}<span>${esc(t.kind)}</span><span>&middot; ${d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span></div>
<div class="link"><input readonly value="${esc(t.url)}" aria-label="Public link" onclick="this.select()"><button class="copy" data-u="${esc(t.url)}">Copy link</button></div><a class="open" href="${esc(t.url)}" target="_blank" rel="noopener">Open tool &rarr;</a></article>`}

function render(){const m=M.find(x=>x.k===cur);$('#intro').textContent=m.i;const r=list();
 $('#count').textContent=`${r.length} tools`;
 if(!r.length){$('#out').innerHTML='<div class="empty">No tools match your search in this collection.</div>';$('#jump').innerHTML='';return}
 const g={};r.forEach(t=>(g[t.sub]=g[t.sub]||[]).push(t));
 const subs=ORDER.filter(s=>g[s]).concat(Object.keys(g).filter(s=>!ORDER.includes(s)));
 $('#jump').innerHTML=subs.map(s=>`<a href="#${slug(s)}" class="${s==='Prophetic Directions'?'pd':''}">${esc(s)} (${g[s].length})</a>`).join('');
 $('#out').innerHTML=subs.map(s=>`<section class="sec ${s==='Prophetic Directions'?'pd':''}" id="${slug(s)}"><h2>${esc(s)} <span>${g[s].length}</span></h2>${NOTE[s]?`<p class="note">${NOTE[s]}</p>`:''}<div class="grid">${g[s].map(card).join('')}</div></section>`).join('')}

 const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='my-interactive-tools.csv';document.body.appendChild(a);a.click();a.remove()};
